name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run shell tests
        run: ./tests/run.sh

      - name: Check release safeguards
        run: node tests/release.test.js

      - name: Check package boundaries, permissions and CI gate
        run: node tests/packaging.test.js

      - name: Validate JSON files
        run: |
          find owrtpc luci-app-owrtpc -type f -name '*.json' -print0 \
            | xargs -0 -n1 jq empty

  packages:
    # nftables needs native Netlink; QEMU user mode cannot emulate NETLINK_NETFILTER.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Enable x86_64 SDK tools on the native ARM64 test host
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: amd64
      - name: Build both APKs and test installation without LuCI
        run: sh scripts/ci-packages.sh

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan history and security dependencies
        run: sh scripts/security-check.sh

  full-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Build with normal dependencies and LuCI minification
        run: sh scripts/ci-sdk-full.sh
