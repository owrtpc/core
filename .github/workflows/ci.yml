name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run shell tests
        run: ./tests/run.sh

      - name: Check release safeguards
        run: node tests/release.test.js

      - name: Check package boundaries, permissions and CI gate
        run: node tests/packaging.test.js

      - name: Validate JSON files
        run: |
          find owrtpc luci-app-owrtpc -type f -name '*.json' -print0 \
            | xargs -0 -n1 jq empty

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd
      - name: Enable ARM64 OpenWrt userspace tests
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build both APKs and test installation without LuCI
        run: sh scripts/ci-packages.sh
