name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run shell tests
        run: ./tests/run.sh

      - name: Validate JSON files
        run: |
          find luci-app-owrtpc -type f -name '*.json' -print0 \
            | xargs -0 -n1 jq empty
