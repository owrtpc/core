services:
  router:
    image: ${OWRTPC_IMAGE:-owrtpc-openwrt:25.12.5-ax3000t}
    container_name: owrtpc-openwrt-test
    platform: linux/arm64
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "${OWRTPC_HTTP_PORT:-8080}:80"
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/luci-static/resources/luci.js"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
